services:
  - type: web
    name: banco-docs
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn banking.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SETTINGS_MODULE
        value: banking.settings
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        value: django-insecure-reemplaza-esta-clave-con-una-real
      - key: PADDLEOCR_AVAILABLE
        value: False
    preDeployCommand: python manage.py migrate
